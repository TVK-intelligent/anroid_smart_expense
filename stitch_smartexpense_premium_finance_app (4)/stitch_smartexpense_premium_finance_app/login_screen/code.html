<body class="bg-surface-bright font-body-md text-on-surface flex items-center justify-center min-h-screen p-4 overflow-hidden relative">
<!-- Subtle Background Element -->

<main class="w-full max-w-md z-10">
<!-- Brand Identity -->

<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>

</header>
<!-- Login Card -->
<section class="bg-surface-container-lowest rounded-xl p-8 shadow-[0px_2px_8px_rgba(15,23,42,0.05)] border border-outline-variant/20">
<h2 class="font-headline-md text-on-surface mb-8">Login to your account</h2>

<!-- Email Field -->

<label class="font-body-md text-on-surface-variant" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="floating-label-group">
<input class="w-full h-14 px-4 pt-2 border border-outline-variant rounded-lg bg-transparent focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all font-body-md" id="password" placeholder=" " type="password"/>
<label class="font-body-md text-on-surface-variant" for="password">Password</label>
<button class="absolute right-4 top-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="text-secondary font-label-sm hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary-container text-on-primary font-title-md rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" style="background-color: #1E3A8A;" type="submit">
                    Login
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>

<!-- Social Login Divider -->

<script>
        // Simple micro-interaction for the password visibility toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Form focus effects for labels
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-secondary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-secondary');
            });
        });
    </script>
