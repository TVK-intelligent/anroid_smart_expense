spring.application.name=smart_expense

# -------------------------------------------------------------
# CẤU HÌNH KẾT NỐI DATABASE (MYSQL)
# Thay đổi thông tin bên dưới phù hợp với môi trường local của bạn
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_expense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password= 12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động thực thi file schema.sql khi khởi chạy ứng dụng
spring.sql.init.mode=always

# ----- JPA/Hibernate Configuration -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
