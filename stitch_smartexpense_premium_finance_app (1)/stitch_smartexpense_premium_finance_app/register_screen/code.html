<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-group:focus-within label {
            color: #3B82F6;
            transform: translateY(-20px) scale(0.85);
        }
        .input-group label {
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- Top App Bar (Suppress Nav on Transactional Screens as per rule) -->
<header class="w-full top-0 sticky flex items-center justify-between px-margin-horizontal h-14 bg-surface z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-low transition-colors rounded-full active:opacity-80" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">SmartExpense</h1>
</div>
</header>
<main class="w-full max-w-[480px] px-margin-horizontal mt-8 mb-12 flex flex-col flex-grow">
<!-- Hero Section -->
<div class="mb-10 text-center md:text-left">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-2">Create Account</h2>
<p class="font-body-md text-on-surface-variant">Start managing your personal finances with institutional precision and ease.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_2px_8px_rgba(15,23,42,0.05)] border border-outline-variant/30">
<form class="space-y-6" id="registerForm">
<!-- Full Name Field -->
<div class="relative input-group">
<div class="flex items-center border border-outline rounded-lg px-4 h-14 focus-within:border-2 focus-within:border-secondary transition-all">
<span class="material-symbols-outlined text-outline mr-3">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full h-full text-on-surface placeholder:text-outline-variant font-body-md" id="fullname" name="fullname" placeholder="Full Name" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="relative input-group">
<div class="flex items-center border border-outline rounded-lg px-4 h-14 focus-within:border-2 focus-within:border-secondary transition-all">
<span class="material-symbols-outlined text-outline mr-3">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full h-full text-on-surface placeholder:text-outline-variant font-body-md" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="relative input-group">
<div class="flex items-center border border-outline rounded-lg px-4 h-14 focus-within:border-2 focus-within:border-secondary transition-all">
<span class="material-symbols-outlined text-outline mr-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full h-full text-on-surface placeholder:text-outline-variant font-body-md" id="password" name="password" placeholder="Password" required="" type="password"/>
<button class="text-outline hover:text-primary transition-colors" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined" id="eye_password">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="relative input-group">
<div class="flex items-center border border-outline rounded-lg px-4 h-14 focus-within:border-2 focus-within:border-secondary transition-all">
<span class="material-symbols-outlined text-outline mr-3">lock_reset</span>
<input class="bg-transparent border-none focus:ring-0 w-full h-full text-on-surface placeholder:text-outline-variant font-body-md" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required="" type="password"/>
<button class="text-outline hover:text-primary transition-colors" onclick="togglePassword('confirm_password')" type="button">
<span class="material-symbols-outlined" id="eye_confirm_password">visibility</span>
</button>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-3 px-1">
<input class="mt-1 w-5 h-5 rounded border-outline text-secondary focus:ring-secondary cursor-pointer" id="terms" type="checkbox"/>
<label class="font-label-sm text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-secondary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-secondary font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-secondary text-on-secondary rounded-full font-title-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="mt-8 flex items-center gap-4">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="font-label-sm text-on-surface-variant">OR REGISTER WITH</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Social Registration -->
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="h-12 border border-outline-variant rounded-full flex items-center justify-center gap-2 hover:bg-surface-container transition-colors active:scale-95">
<img alt="Google" class="w-5 h-5" data-alt="A clean and professional photograph of a Google G-Suite logo on a pristine white background. The image is captured with high-key studio lighting, creating a minimalist and high-tech corporate atmosphere consistent with a premium financial application's aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCX6WNtcQoMZXTJB4oOh3iACXLVXWWkgZ5ka3ij87OVtK0bhpNNVIncrD8kH8HFEKWL_-BYUWt_tsbzq5Bj08xH_Hq6llU_Rj3rNLQwbBqWwGsy2lwhGIMfj46UUdPndYCPDgtXHC_BxmgGolrUUyyUNEbmm5n5ysbihPflp_GNGeectMJwEJQwE3zNWGCko2WqEtm6qyTHwIryQFVFtl_J12bXQSfqEm6BJuNgV98jnumXl7NaXynwaVPO3vEKOjfDyU9rIjTrf7er"/>
<span class="font-label-sm">Google</span>
</button>
<button class="h-12 border border-outline-variant rounded-full flex items-center justify-center gap-2 hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[#1877F2]">face_nod</span>
<span class="font-label-sm">Facebook</span>
</button>
</div>
</div>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-secondary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
<!-- Decorative background element -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-secondary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-10 -left-10 w-48 h-48 bg-tertiary-fixed-dim/10 rounded-full blur-3xl -z-10"></div>
</main>
<script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById('eye_' + inputId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                eye.innerText = 'visibility';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const terms = document.getElementById('terms').checked;

            if (!terms) {
                alert('Please accept the Terms and Conditions.');
                return;
            }

            if (password !== confirm) {
                alert('Passwords do not match.');
                return;
            }

            // Mock success interaction
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span>';
            btn.disabled = true;

            setTimeout(() => {
                alert('Registration successful! Redirecting to dashboard...');
                // Reset for demo purposes
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
