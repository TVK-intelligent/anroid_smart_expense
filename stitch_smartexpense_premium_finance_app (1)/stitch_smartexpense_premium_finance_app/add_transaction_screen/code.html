<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#4edea3",
                        "on-primary": "#ffffff",
                        "outline": "#757682",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f8f9ff",
                        "outline-variant": "#c5c5d3",
                        "on-secondary-fixed": "#001a42",
                        "surface-dim": "#cbdbf5",
                        "inverse-primary": "#b6c4ff",
                        "tertiary": "#00311f",
                        "background": "#f8f9ff",
                        "secondary-fixed-dim": "#adc6ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface": "#0b1c30",
                        "secondary": "#0058be",
                        "surface-container-highest": "#d3e4fe",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#444651",
                        "surface": "#f8f9ff",
                        "tertiary-container": "#004a31",
                        "on-primary-fixed-variant": "#264191",
                        "surface-container-high": "#dce9ff",
                        "primary-container": "#1e3a8a",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#27c38a",
                        "surface-tint": "#4059aa",
                        "surface-container": "#e5eeff",
                        "secondary-container": "#2170e4",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#00164e",
                        "surface-variant": "#d3e4fe",
                        "on-background": "#0b1c30",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-secondary-container": "#fefcff",
                        "on-primary-container": "#90a8ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary": "#ffffff",
                        "primary": "#00236f",
                        "inverse-surface": "#213145",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#004395",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#dce1ff",
                        "secondary-fixed": "#d8e2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-space-lg": "24px",
                        "base": "8px",
                        "container-padding": "16px",
                        "margin-horizontal": "16px",
                        "stack-space-md": "12px",
                        "stack-space-sm": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "display-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "display-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar (Based on Shared Components JSON) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface flex items-center justify-between px-margin-horizontal h-14 z-50">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors rounded-full p-2 active:opacity-80 transition-opacity duration-150">
                arrow_back
            </button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Add Transaction</h1>
</div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors rounded-full p-2 active:opacity-80 transition-opacity duration-150">
            notifications
        </button>
</header>
<main class="max-w-xl mx-auto px-margin-horizontal mt-stack-space-lg flex flex-col gap-8">
<!-- Type Toggle: Segmented Button -->
<div class="flex p-1 bg-surface-container-low rounded-full w-full">
<button class="flex-1 py-2 rounded-full font-title-md text-title-md transition-all duration-200 bg-secondary-container text-on-secondary-container shadow-sm" id="expenseBtn" onclick="toggleType('expense')">
                Expense
            </button>
<button class="flex-1 py-2 rounded-full font-title-md text-title-md transition-all duration-200 text-on-surface-variant hover:bg-surface-container-high" id="incomeBtn" onclick="toggleType('income')">
                Income
            </button>
</div>
<!-- Amount Input Section -->
<div class="flex flex-col items-center gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Amount</label>
<div class="flex items-baseline gap-1">
<span class="font-display-lg text-display-lg text-on-surface-variant">$</span>
<input class="bg-transparent border-none text-center font-display-lg text-display-lg focus:ring-0 w-48 text-primary placeholder:text-outline-variant" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<!-- Form Cards Container -->
<div class="flex flex-col gap-stack-space-md">
<!-- Category Selector (Horizontal Scroll) -->
<div class="bg-surface-container-lowest rounded-xl p-container-padding shadow-[0px_2px_8px_rgba(15,23,42,0.05)]">
<div class="flex justify-between items-center mb-4">
<label class="font-title-md text-title-md text-on-surface">Category</label>
<button class="text-primary font-label-sm text-label-sm">View All</button>
</div>
<div class="flex overflow-x-auto gap-4 pb-2 hide-scrollbar">
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Food</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">directions_car</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Transport</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Shopping</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">home</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Rent</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">movie</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Leisure</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Other</span>
</button>
</div>
</div>
<!-- Wallet & Date Selectors -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-space-md">
<div class="bg-surface-container-lowest rounded-xl p-container-padding shadow-[0px_2px_8px_rgba(15,23,42,0.05)] flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex-1">
<label class="font-label-sm text-label-sm text-outline block">Account</label>
<select class="w-full bg-transparent border-none p-0 font-title-md text-title-md text-on-surface focus:ring-0 cursor-pointer">
<option>Checking ...4201</option>
<option>Savings ...9928</option>
<option>Credit Card ...1102</option>
</select>
</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-container-padding shadow-[0px_2px_8px_rgba(15,23,42,0.05)] flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div class="flex-1">
<label class="font-label-sm text-label-sm text-outline block">Date</label>
<input class="w-full bg-transparent border-none p-0 font-title-md text-title-md text-on-surface focus:ring-0 cursor-pointer" type="date" value="2023-10-27"/>
</div>
</div>
</div>
<!-- Note/Description -->
<div class="bg-surface-container-lowest rounded-xl p-container-padding shadow-[0px_2px_8px_rgba(15,23,42,0.05)]">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary shrink-0 mt-1">
<span class="material-symbols-outlined">notes</span>
</div>
<div class="flex-1">
<label class="font-label-sm text-label-sm text-outline block mb-1">Notes</label>
<textarea class="w-full bg-transparent border-none p-0 font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant resize-none" placeholder="What was this for?" rows="2"></textarea>
</div>
</div>
</div>
<!-- Receipt Attachment (Extra Polish) -->
<div class="bg-surface-container-lowest border-2 border-dashed border-outline-variant rounded-xl p-container-padding flex flex-col items-center justify-center gap-2 group hover:border-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-outline group-hover:text-primary">add_a_photo</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary">Add Receipt Photo</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md shadow-[0px_8px_24px_rgba(15,23,42,0.15)] active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Save Transaction</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</main>
<!-- BottomNavBar (Suppressed as per "Task-Focused" rule, but following layout logic if it were rendered) -->
<!-- Suppression logic applied: this is a Task-Focused sub-page. No BottomNavBar rendered. -->
<script>
        function toggleType(type) {
            const expenseBtn = document.getElementById('expenseBtn');
            const incomeBtn = document.getElementById('incomeBtn');
            
            if (type === 'expense') {
                expenseBtn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-sm');
                expenseBtn.classList.remove('text-on-surface-variant');
                incomeBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-sm');
                incomeBtn.classList.add('text-on-surface-variant');
            } else {
                incomeBtn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-sm');
                incomeBtn.classList.remove('text-on-surface-variant');
                expenseBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-sm');
                expenseBtn.classList.add('text-on-surface-variant');
            }
        }
    </script>
</body></html>
