<style>
        @keyframes md-progress-indeterminate {
            0% { left: -35%; width: 35%; }
            60% { left: 100%; width: 100%; }
            100% { left: 100%; width: 0%; }
        }
        
        .loading-track {
            overflow: hidden;
            position: relative;
        }
        
        .loading-indicator {
            position: absolute;
            height: 100%;
            background-color: #00236f;
            animation: md-progress-indeterminate 2s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<img alt="SmartExpense Logo" class="w-16 h-16 object-contain" data-alt="A premium minimalist corporate logo for a high-end fintech banking application. The icon features clean, sharp geometric lines forming the letters S and E, rendered in a pristine white on a deep navy blue background. The style is ultra-modern, using high-key studio lighting with soft shadows to emphasize institutional trust and technological precision, consistent with a professional financial services aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrpzDNUD5ldLKDMszDuO_K8MPK4idtn3ysLHjoKXfOByWmqt5vdox14tj1oM95IYLc-Xn2q5SlBlHRD_7VlIFWsMyMKD5VoioQy53ggv2-Km40Er7k9d0SDf8FXujgElhVBbSl0jiujAgziGqXQU03wbau72pgCARNiSp3EBnEsv3bc7XNiFsw2ovu0Fft_hawMxqFFwS-6W23m3WNs77gUJw92G1SBRAVaC1rOLUC4r1i8pVtSczR9k3vcFK2NNzBl8VJVV3X4qxI"/>

</main>
<!-- Bottom Indicator Section -->

</div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest opacity-60">
            Secure Connection
        </span>
</footer>
<!-- Micro-interaction script -->
<script>
        // Atmospheric entrance effect
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            const footer = document.querySelector('footer');
            
            // Subtle delay for the footer
            footer.style.opacity = '0';
            footer.style.transform = 'translateY(20px)';
            footer.style.transition = 'all 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s';
            
            setTimeout(() => {
                footer.style.opacity = '1';
                footer.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
